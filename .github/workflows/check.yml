name: Check build
on: [push, pull_request]
jobs:
  css-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Built files are committed
        run: git diff --exit-code || (echo "::error::Run 'npm run build' and commit the result" && exit 1)
